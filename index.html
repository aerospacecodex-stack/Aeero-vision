<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Page</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>

    <div class="login-container">
        <!-- Left Side -->
        <div class="login-brand">
            <div class="brand-content">
                <h2>Welcome Back!</h2>
                <p>To keep connected with us please Signin with your personal info.</p>
            </div>
        </div>

        <!-- Right Side -->
        <div class="login-form-section">
            <form class="login-form" id="loginForm">
                <h2>Member Signin</h2>
                <p class="subtitle">Please enter your details to sign in.</p>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a class="forgot-password" href="forget.html">Forgot password?</a>
                </div>

                <!-- Button is now INSIDE the form, no <a> around it -->
                <button type="submit" class="submit-btn"><b>Sign in</b></button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault(); // stop the normal form submit

            // The browser has already checked that email and password are filled
            // and valid (because of "required", type="email" and minlength).
            window.location.href = "index1.htm"; // your page name
        });
    </script>
</body>
</html>
